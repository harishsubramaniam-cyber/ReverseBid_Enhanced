{% extends "base.html" %}
{% block title %}Sign out — {{ app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:460px; margin:8vh auto; text-align:center; padding:30px">
  <h1 style="margin-bottom:8px">Sign out?</h1>
  <p style="color:var(--ink-2)">You will need your email and password to get back in.</p>
  <form method="post" action="/logout" style="margin-top:18px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="btn-row" style="justify-content:center">
      <button class="btn" type="submit">Sign me out</button>
      <a class="btn ghost" href="/">Stay signed in</a>
    </div>
  </form>
</div>
{% endblock %}
